<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IDIOMS GAME - Trivial Zone</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;background:#101b2d}
body{display:grid;grid-template-rows:auto 1fr}
.top{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(90deg,#14243a,#1a2d48);border-bottom:1px solid rgba(255,255,255,.16);color:white;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.brand{font-weight:900;letter-spacing:.08em;margin-right:auto}.btn{display:inline-flex;align-items:center;min-height:40px;padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;font-size:11px;font-weight:900;background:rgba(255,255,255,.09);letter-spacing:.03em}.btn.back-zone{background:#fff;color:#172033;border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.18)}
.btn.main{border-color:#b394ff;box-shadow:0 0 16px #b394ff55}
.frame-wrap{position:relative;min-height:0}.frame{width:100%;height:100%;border:0;background:white}
.fallback{position:absolute;right:14px;bottom:14px}.fallback a{background:#fff;color:#172033;text-decoration:none;padding:10px 13px;border-radius:10px;font-size:11px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media(max-width:620px){.brand{font-size:12px}.btn{font-size:10px;padding:7px 9px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">IDIOMS GAME</div>
  <a class="btn back-zone" href="./trivial-zone.html">← BACK TO TRIVIAL ZONE</a>
  <a class="btn main" href="./index.html">MAIN CONSOLE</a>
</div>
<div class="frame-wrap">
  <iframe class="frame" src="https://idiomsgame.netlify.app" title="IDIOMS GAME" allow="fullscreen"></iframe>
  <div class="fallback"><a href="https://idiomsgame.netlify.app" target="_blank" rel="noopener">OPEN FULLSCREEN</a></div>
</div>
</body>
</html>
